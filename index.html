<style>

body{

    background:#111;

header{

    text-align:center;
    padding:20px;
}

header h1{

}

.banner{
    text-align:center;

}

    color:#ffd700;
}

}

.grid{
    width:90%;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:25px;
    margin-bottom:40px;
}

.card{
    background:#222;
    padding:15px;
    border-radius:10px;
    text-align:center;
}

iframe{
    width:100%;
    height:250px;
    border:none;
    border-radius:10px;
}

h3{
    margin-top:15px;
}

button{
    margin-top:10px;
    background:#28a745;
    color:white;
    border:none;
    padding:12px 25px;
    font-size:17px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#1f8a36;
}

footer{
    background:#000;
    text-align:center;
    padding:20px;
    color:#aaa;
}

@media(max-width:768px){

.grid{
grid-template-columns:1fr;
}

iframe{
height:220px;
}

}

</style>

</head>

    body{

      display:flex;align-items:center;justify-content:center;padding:28px;color:white;
    }
    .card{width:100%;max-width:900px;background:var(--card-bg);border-radius:12px;padding:18px;box-shadow:0 8px 30px rgba(2,6,23,0.25)}
    h1{margin:0 0 8px 0;font-size:20px}
    .meta{color:var(--muted);font-size:13px;margin-bottom:12px}
    .menu{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
    select,button{padding:8px;border-radius:8px;border:none;font-size:15px}
    select{min-width:220px}
    button.primary{background:var(--accent);color:#022;cursor:pointer}
    button.secondary{background:transparent;color:var(--muted);border:1px solid rgba(255,255,255,0.08)}
    #quizArea{margin-top:12px}
    .question-card{background:rgba(0,0,0,0.18);padding:14px;border-radius:10px}
    .qtext{font-weight:600;margin-bottom:12px}
    .options{display:flex;flex-direction:column;gap:8px}
    .opt-btn{background:#fff;border:none;padding:10px;border-radius:8px;text-align:left;cursor:pointer}
    .opt-btn.correct{background:#16a34a;color:#fff}
    .opt-btn.wrong{background:#dc2626;color:#fff}
    #feedback{margin-top:10px;font-weight:700}
    .footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--muted);font-size:14px}
    @media (max-width:640px){ .menu{flex-direction:column;align-items:stretch} select{width:100%} }
  </style>
</head>

        <option value="ap">Arithmetic Progression</option>

        <option value="mens">Mensuration</option>

      <button id="menuBtn" class="secondary" style="display:none">Back to Menu</button>
      <div style="margin-left:auto" id="progress" class="meta">Q <span id="cur">0</span> / <span id="tot">0</span></div>
    </div>

    <div id="quizArea" style="display:none">
      <div class="question-card">
        <div id="questionNum" class="meta"></div>
        <div id="questionText" class="qtext"></div>
        <div id="options" class="options"></div>
        <div id="feedback"></div>
      </div>
    </div>

    <div id="resultArea" style="display:none;margin-top:12px;text-align:center">
      <h2 id="resultText"></h2>
      <button id="againBtn" class="primary">Retry Chapter</button>
      <button id="backMenuBtn" class="secondary">Back to Menu</button>
    </div>
  </div>

/* =========================
   QUIZ LOGIC
========================= */
let currentChapter = null;
let questions = [];
let curIndex = 0;

const chapterSelect = document.getElementById("chapterSelect");
const startBtn = document.getElementById("startBtn");
const menuBtn = document.getElementById("menuBtn");
const quizArea = document.getElementById("quizArea");
const resultArea = document.getElementById("resultArea");
const questionText = document.getElementById("questionText");
const optionsDiv = document.getElementById("options");
const feedback = document.getElementById("feedback");
const questionNum = document.getElementById("questionNum");
const curDisplay = document.getElementById("cur");
const totDisplay = document.getElementById("tot");
const againBtn = document.getElementById("againBtn");
const backMenuBtn = document.getElementById("backMenuBtn");

function startChapter() {
  currentChapter = chapterSelect.value;
  if(!currentChapter) return alert("Select a chapter!");
  questions = [...allQuestions[currentChapter]];
  curIndex = 0;
  document.getElementById("cur").textContent = 1;
  document.getElementById("tot").textContent = questions.length;
  startBtn.style.display="none";
  chapterSelect.style.display="none";
  menuBtn.style.display="inline-block";
  quizArea.style.display="block";
  resultArea.style.display="none";
  showQuestion();
}

function showQuestion() {
  let q = questions[curIndex];
  questionText.textContent = q.q;
  optionsDiv.innerHTML = "";
  feedback.textContent = "";
  questionNum.textContent = `Question ${curIndex+1}`;
  q.options.forEach((opt,idx)=>{
    let btn = document.createElement("button");
    btn.className="opt-btn";
    btn.textContent=opt;
    btn.onclick=()=>selectAnswer(idx);
    optionsDiv.appendChild(btn);
  });
}

function selectAnswer(idx) {
  let q = questions[curIndex];
  [...optionsDiv.children].forEach((b,i)=>{
    b.disabled = true;
    if(i===q.answer) b.classList.add("correct");
    else if(i===idx) b.classList.add("wrong");
  });
  feedback.textContent = idx===q.answer ? "Correct ✅" : "Incorrect ❌";
  setTimeout(()=>{
    curIndex++;
    if(curIndex<questions.length){
      curDisplay.textContent = curIndex+1;
      showQuestion();
    } else {
      showResult();
    }
  }, 600);
}

function showResult() {
  quizArea.style.display="none";
  resultArea.style.display="block";
  resultText.textContent=`Chapter Complete!`;
}

startBtn.addEventListener("click",startChapter);
menuBtn.addEventListener("click",()=>{
  quizArea.style.display="none";
  startBtn.style.display="inline-block";
  chapterSelect.style.display="inline-block";
  menuBtn.style.display="none";
});
againBtn.addEventListener("click",startChapter);
backMenuBtn.addEventListener("click",()=>{
  resultArea.style.display="none";
  startBtn.style.display="inline-block";
  chapterSelect.style.display="inline-block";
});
